<!DOCTYPE html>
<html>
  <head>
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <script src="/js/bootstrap.bundle.min.js"></script>
    {% block head %}{% end %}
  </head>
  <body class="text-center" {% block body_attrs %}{% end %} style="background-color:#4f0518">
    <main class="container-fluid px-md-4">
      <nav class="navbar navbar-dark" aria-label="First navbar example" style="background-color:#4f0518">
        <div class="container-fluid">
          <a class="navbar-brand" href="#"></a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarsExample01" aria-controls="navbarsExample01" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="navbarsExample01">
            <ul class="navbar-nav me-auto mb-2">
              <li class="nav-item">
                <a class="nav-link {% if request.path == '/user' %}active{% end %}" href="/user">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link {% if request.path == '/banish' %}active{% end %}" id="banishoption" href="/banishpage">Banish</a>
              </li>
              <li class="nav-item">
		  {% if is_traitor %}
		      <a class="nav-link {% if request.path == '/murder' %}active{% end %}" id="murderoption" href="/murderpage" tabindex="-1">Murder</a>
		  {% else %}
		      <a class="nav-link disabled {% if request.path == '/murder' %}active{% end %}" id="murderoption" href="/murderpage" tabindex="-1" aria-disabled="true">Murder</a>
		  {% end %}
              </li>
              <li class="nav-item">
                <a class="nav-link {% if request.path == '/rules' %}active{% end %}" id="rulesoption" href="/rules">Rules</a>
              </li>
              <li class="nav-item">
                <a class="nav-link {% if request.path == '/scoreboard' %}active{% end %}" id="scoreboardoption" href="/scoreboard">Scoreboard</a>
              </li>
              <li class="nav-item">
                <a class="nav-link {% if request.path == '/schedule' %}active{% end %}" id="scheduleoption" href="/schedule">Schedule</a>
              </li>
            </ul>
            <form>
              <input class="form-control" type="text" placeholder="Search" aria-label="Search">
            </form>
          </div>
        </div>
      </nav>

      <img class="mb-4" src="/images/logo_transparent.png" alt="" width="200">
      {% block content %}{% end %}
    </main>
  </body>
</html>
