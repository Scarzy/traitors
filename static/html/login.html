<html>
	<head>
		<link href="/css/login.css" rel="stylesheet">
		<link href="/css/bootstrap.min.css" rel="stylesheet">
		<script src="/js/bootstrap.bundle.min.js"></script>

	</head>
	<body class="text-center">
		<main class="form-signin">
			<form action="/login" method="post">
				<!--<img class="mb-4" src="../assets/brand/bootstrap-logo.svg" alt="" width="72" height="57">-->
				<h1 class="h3 mb-3 fw-normal">Please sign in</h1>
				
				<div class="form-floating">
					<input type="name" name="name" class="form-control" id="floatingInput" placeholder="Maca Paka">
					<label for="floatingInput">Name</label>
				</div>
				<div class="form-floating">
					<input type="authenticator" class="form-control" id="floatingPassword" placeholder="Password" style="display:none">
				</div>
				
				<button class="w-100 btn btn-lg btn-primary" type="submit">Sign in</button>
				<p class="mt-5 mb-3 text-muted">&copy; 2026</p>
			</form>
		</main>

	</body>
</html>
