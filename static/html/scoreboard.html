<html>
	<head>
		<link href="/css/bootstrap.min.css" rel="stylesheet">
		<script src="/js/bootstrap.bundle.min.js"></script>
		<script src="/js/navbar.js"></script>
		<script src="/js/scoreboard.js"></script>
		<style>
			.border-gold {background-color: #FFD700 !important;}
			.border-silver {background-color: #C0C0C0 !important;}
			.border-bronze {background-color: #CD7F32 !important;}
		</style>
	</head>
	<body class="text-center" onload="get_scores(); get_thresholds(); start_timers()" style="background-color:#4f0518">
		<main class="
			container-fluid
			px-md-4
			">
			<div id="navbar-placeholder"></div>
		<img class="mb-4" src="/images/logo_transparent.png" alt="" width="200">
	<div class="row row-cols-1 row-cols-md-3 mb-3 text-center align-items-end">
      <div class="col">
        <div class="card mb-4 rounded-3 shadow-sm border-bronze mt-md-5">
          <div class="card-header py-3">
            <h4 class="my-0 fw-normal" id="thirdplacename">Third Place</h4>
          </div>
          <div class="card-body py-1">
            <h1 class="card-title pricing-card-title" id="thirdplacescore">123</h1>
          </div>
        </div>
      </div>
      <div class="col">
        <div class="card mb-4 rounded-3 shadow-sm border-gold mt-md-0">
          <div class="card-header py-3">
            <h4 class="my-0 fw-normal" id="firstplacename">First Place</h4>
          </div>
          <div class="card-body py-5">
            <h1 class="card-title pricing-card-title" id="firstplacescore">321</h1>
          </div>
        </div>
      </div>
      <div class="col">
        <div class="card mb-4 rounded-3 shadow-sm border-silver mt-md-3">
          <div class="card-header py-3">
            <h4 class="my-0 fw-normal" id="secondplacename">Second Place</h4>
          </div>
          <div class="card-body py-3">
            <h1 class="card-title pricing-card-title" id="secondplacescore">213</h1>
          </div>
        </div>
      </div>
    </div>


      <div class="table-responsive">
        <table class="table table-striped table-sm text-light">
          <thead>
            <tr>
              <th scope="col">#</th>
              <th scope="col">Name</th>
              <th scope="col">Score</th>
            </tr>
          </thead>
          <tbody id="fullscorestable">
          </tbody>
        </table>
      </div>

      <div class="table-responsive">
        <table class="table table-striped table-sm text-light">
          <tbody>
            <tr class="text-light">
		<td class="col-1 text-end">Votes required to banish:</td>
                <td class="col-1 text-start" id="banishthreshold">10</td>
                <td class="col-1 text-end">Votes required to murder:</td>
                <td class="col-1 text-start" id="murderthreshold">10</td>
                <td class="col-1 text-end">Votes required to recruit:</td>
                <td class="col-1 text-start" id="recruitthreshold">10</td>
            </tr>
          </tbody>
        </table>
      </div>
		</main>
	</body>
</html>
