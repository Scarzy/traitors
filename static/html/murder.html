<html>
	<head>
		<link href="/css/bootstrap.min.css" rel="stylesheet">
		<script src="/js/bootstrap.bundle.min.js"></script>
		<script src="/js/navbar.js"></script>
		<script src="/js/banish.js"></script>
		<style>
			.border-gold {background-color: #FFD700 !important;}
			.border-silver {background-color: #C0C0C0 !important;}
			.border-bronze {background-color: #CD7F32 !important;}
			/* Keep default look on hover and focus */
			.btn-press-only:hover,
			.btn-press-only:focus,
			.btn-press-only:focus-visible {
			  background-color: var(--bs-btn-bg);
			  border-color: var(--bs-btn-border-color);
			  color: var(--bs-btn-color);
			  box-shadow: none;
			}
			
			/* Change only while actively pressing down */
			.btn-press-only:active {
			  background-color: var(--bs-danger);
			  border-color: var(--bs-danger);
			  color: var(--bs-white);
			  transform: scale(0.98);
			}
			/* Hide active text by default */
			.btn-press-text .text-active {
			  display: none;
			}
			
			/* Swap text only while actively pressing */
			.btn-press-text:active .text-default {
			  display: none;
			}
			
			.btn-press-text:active .text-active {
			  display: inline;
			}

		</style>
	</head>
	<body class="text-center" onload="get_scores()" style="background-color:#4f0518">
		<main class="
			container-fluid
			py-5
			">
			<div id="navbar-placeholder"></div>
			<div class="row justify-content-center">
				<div class="col-12 col-md-8 col-lg-5">
					<img class="mb-4" src="/images/logo_transparent.png" alt="" width="200">
					<form action="/banish" method="post">
						<h1 class="h3 mb-3 fw-normal text-light">Select Player</h1>
						
						<div class="mb-3">
							<select class="form-select" id="banish-select"></select>
						</div>
						
						<div class="d-flex gap-0">
							<button class="w-50 btn btn-lg btn-primary" type="submit">Murder</button>
							<button class="w-50 btn btn-lg btn-primary" type="submit">Recruit</button>
						</div>
					</form>
				</div>
			</div>

		</main>
	</body>
</html>
