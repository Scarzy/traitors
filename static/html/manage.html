<html>
	<head>
		<link href="/css/bootstrap.min.css" rel="stylesheet">
		<script src="/js/bootstrap.bundle.min.js"></script>
		<script src="/js/manage.js"></script>
		<style>
			.border-gold {background-color: #FFD700 !important;}
			.border-silver {background-color: #C0C0C0 !important;}
			.border-bronze {background-color: #CD7F32 !important;}
		</style>
	</head>
	<body class="text-center" onload="get_users(); add_major_action_listeners()" style="background-color:4f0518">
		<main class="
			container-fluid
			px-md-4
			">
		<img class="mb-4" src="/images/logo_transparent.png" alt="" width="200">
		<div class="table-responsive">
		  <table class="table table-striped table-sm text-light">
		    <thead>
		      <tr>
		        <th scope="col">Name</th>
		        <th scope="col">Role</th>
		        <th scope="col">Actions</th>
		      </tr>
		    </thead>
		    <tbody id="userstable">
		    </tbody>
		  </table>
		</div>
		<button type="button" class="btn btn-danger" id="dayturnover">Roll the day</button>
		</main>
	</body>
</html>
